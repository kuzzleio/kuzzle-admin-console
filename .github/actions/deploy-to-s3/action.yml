name: Deploy to AWS S3
description: Upload a tested admin console build to S3 and invalidate the Cloudfront cache

# Le build n'est pas fait ici : le job appelant télécharge celui que les specs
# ont validé (ADR-0066). Reconstruire au déploiement mettait en ligne un build
# que rien n'avait testé.

inputs:
  AWS_ACCESS_KEY_ID:
    description: AWS Access key ID
    required: true
  AWS_SECRET_ACCESS_KEY:
    description: AWS secret key
    required: true
  S3_BUCKET:
    description: S3 bucket name
    required: true
  CLOUDFRONT_ID:
    description: Cloudfront distribution ID
    required: true
  REGION:
    description: AWS default region
    required: true
    default: 'us-west-2'
  TARGET_DIST:
    description: Build artifact folder to deploy
    required: true
    default: dist

runs:
  using: "composite"
  steps:
    - name: Upload to S3
      run: ${{ github.action_path }}/deploy.sh
      env:
        S3_BUCKET: ${{ inputs.S3_BUCKET }}
        TARGET_DIST: ${{ inputs.TARGET_DIST }}
        AWS_ACCESS_KEY_ID: ${{ inputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ inputs.REGION }}
      shell: bash

    # `/*` et non `/index.html` seul : les favicons et `images/` n'ont pas de
    # hash, et les objets copiés avant ADR-0066 n'avaient pas de Cache-Control.
    - name: Invalidate Cloudfront cache
      run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths '/*'
      env:
        CLOUDFRONT_ID: ${{ inputs.CLOUDFRONT_ID }}
        AWS_ACCESS_KEY_ID: ${{ inputs.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ inputs.REGION }}
      shell: bash
