name: Lint
description: Run ESLint, the type check, the unreachable-modules check, the listener-name-collision check and the undeclared-DOM-emits check
runs:
  using: "composite"
  steps:
    - run: npm ci
      shell: bash

    - run: npm run test:lint
      shell: bash

    - run: npm run test:types
      shell: bash

    - run: npm run check:unreachable
      shell: bash

    - run: npm run check:listener-collisions
      shell: bash

    - run: npm run check:dom-emits
      shell: bash
