name: Lint
description: Run ESLint, the unreachable-modules check and the listener-name-collision check
runs:
  using: "composite"
  steps:
    - run: npm ci
      shell: bash

    - run: npm run test:lint
      shell: bash

    - run: npm run check:unreachable
      shell: bash

    - run: npm run check:listener-collisions
      shell: bash
