name: Checks

# Lint, build, image Docker et specs, appelés par les trois workflows (ADR-0067) : les
# pull requests, et les pushes sur 5-dev et master, qui déploient ensuite
# l'artefact `dist` de ce run (ADR-0066). Ces jobs existaient en trois
# copies identiques ; une spec ajoutée devait l'être trois fois.
#
# Les actions sont épinglées par SHA, la version en commentaire. Le jeton n'a
# que `contents: read`, fixé par chaque appelant.

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Run linter
        uses: ./.github/actions/lint

  # Un seul build par run : les specs le valident, le déploiement copie
  # celui-là (ADR-0066).
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        # Un `npm ci` a déjà pendu 1 h 30 après avoir fini d'installer (G-073).
        timeout-minutes: 10
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 5

  # L'image n'était construite par rien : elle a servi nginx 1.27 sans un
  # en-tête pendant que la CSP partait sur CloudFront (ADR-0068).
  docker-image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg COMMIT_HASH="${GITHUB_SHA::8}" -t admin-console .

      - name: Start container
        run: |
          docker run -d --name console -p 8080:8080 admin-console
          timeout 30 sh -c 'until curl -fs http://localhost:8080/ > /dev/null; do sleep 1; done'

      - name: Smoke test
        run: docker/smoke-test.sh http://localhost:8080 console

  e2e-tests:
    name: E2E Test - ${{ matrix.spec }}
    needs: [lint, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        spec:
          - login
          - users
          - roles
          - profiles
          - resetpassword
          - JSONEditor
          - chartView
          - formView
          - treeview
          - '404'
          - api-actions
          - collections
          - docs
          - environments
          - indexes
          - search
          - watch

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        # Un `npm ci` a déjà pendu 1 h 30 après avoir fini d'installer (G-073).
        timeout-minutes: 10
        run: npm ci

      - name: Start Kuzzle
        run: |
          docker compose up --wait
          docker ps
          curl -v http://localhost:7512/_healthcheck

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Start preview server
        run: |
          npx vite preview --host 0.0.0.0 --port 8080 &
          echo $! > preview.pid

          echo "Waiting for preview server..."
          timeout=30
          until curl -s http://localhost:8080 > /dev/null; do
            sleep 1
            timeout=$((timeout-1))
            if [ $timeout -eq 0 ]; then
              echo "Preview server failed to start"
              exit 1
            fi
          done
          echo "Preview server is ready!"

      - name: Run Cypress test
        run: |
          npx cypress run \
            --spec "test/e2e/cypress/integration/single-backend/${SPEC}.spec.js" \
            --browser chrome \
            --config baseUrl=http://localhost:8080,retries=2
        env:
          SPEC: ${{ matrix.spec }}

      - name: Cleanup
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-results-${{ matrix.spec }}
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results
          retention-days: 5

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-snapshots-${{ matrix.spec }}
          path: test/e2e/failed-test
          retention-days: 5

  # Rouge dès qu'un job n'a pas réussi, `skipped` et `cancelled` compris : un
  # build en échec saute les specs, et le résumé passait au vert.
  test-summary:
    name: Tests Summary
    needs: [lint, build, docker-image, e2e-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create Summary
        run: |
          {
            echo "# Test Results Summary 📊"
            echo "## Details"
            echo "- Lint: $LINT"
            echo "- Build: $BUILD"
            echo "- Docker image: $DOCKER"
            echo "- E2E Tests: $E2E"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LINT" = success ] && [ "$BUILD" = success ] && [ "$DOCKER" = success ] && [ "$E2E" = success ]; then
            echo "✅ All tests passed!" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some checks did not succeed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker-image.result }}
          E2E: ${{ needs.e2e-tests.result }}
