name: Main branches push checks

on:
  push:
    branches:
      - master

# Un seul run à la fois, dans l'ordre des pushes : sans ce bloc, des fusions
# rapprochées déploient en parallèle et le dernier run à *finir* gagne, pas le
# dernier commit. `cancel-in-progress: false` laisse finir le run en cours ;
# GitHub annule les runs en attente qu'un plus récent remplace. Voir ADR-0037.
concurrency:
  group: deploy-console-production
  cancel-in-progress: false

# Le dépôt donne `write` par défaut au jeton : aucun job n'écrit, le
# déploiement passe par les clés AWS (ADR-0067).
permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  deploy-production:
    name: Deploy Admin Console to production - console.kuzzle.io
    # `checks` échoue dès qu'un de ses jobs échoue, lint compris (ADR-0066).
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to S3
        uses: ./.github/actions/deploy-to-s3
        with:
          REGION: us-west-2
          S3_BUCKET: console.kuzzle.io
          CLOUDFRONT_ID: E2GPBJ9T0QR37G
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
