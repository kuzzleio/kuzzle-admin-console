# Configuration nginx de l'image Docker (ADR-0068). Remplace celle de l'image
# de base. Le routeur est en `createWebHashHistory` : toutes les routes vivent
# sous `/#/`, aucune réécriture vers `index.html` n'est nécessaire.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mêmes règles de cache que le déploiement S3 (ADR-0066).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
